spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:translate_novel}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 生产环境请务必通过环境变量 JWT_SECRET 覆盖（长度至少 32 字节）；默认值仅用于本地开发
  secret: ${JWT_SECRET:replace-with-a-longer-local-development-secret-key}
  expiration-ms: 900000
  refresh-expiration-ms: 2592000000

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  upload-dir: ./uploads

translation:
  provider: auto
  openai:
    # 兼容 OpenAI Chat Completions 格式的服务商（OpenAI / 智谱 / DeepSeek 等），
    # 通过环境变量切换，例如智谱：OPENAI_BASE_URL=https://open.bigmodel.cn/api/paas/v4，OPENAI_MODEL=glm-5.3-flash
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5-mini}
    # 带思考能力的模型（如 glm-5.3-flash）思考 token 也计入该上限，本地建议调大到 2048
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:400}
  google-web:
    base-url: https://translate.googleapis.com/translate_a/single
