spring:
  datasource:
    url: jdbc:h2:mem:novelreader-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: replace-with-a-longer-local-development-secret-key
  expiration-ms: 900000
  refresh-expiration-ms: 2592000000

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  upload-dir: ./target/test-uploads

translation:
  provider: placeholder
